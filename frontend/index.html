<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi Notes - CRUD Fullstack dengan Express.js dan MySQL">
  <title>Aplikasi Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <svg class="navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        <span>Aplikasi Notes</span>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- Hero -->
    <header class="hero">
      <h1>Aplikasi Notes</h1>
      <p>Kelola catatan kamu dengan mudah dan efisien.</p>
    </header>

    <!-- Form Card -->
    <section class="card form-card" id="form-section">
      <h2 class="card-title" id="form-title">Tambah Catatan Baru</h2>
      <form id="note-form" autocomplete="off">
        <div class="form-group">
          <label for="judul">Judul</label>
          <input type="text" id="judul" placeholder="Masukkan judul catatan" required>
        </div>
        <div class="form-group">
          <label for="isi">Isi Catatan</label>
          <textarea id="isi" rows="4" placeholder="Tuliskan isi catatan di sini..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel" style="display:none;">Batal</button>
          <button type="submit" class="btn btn-primary" id="btn-submit">Simpan</button>
        </div>
      </form>
    </section>

    <!-- Notes List -->
    <section class="notes-section">
      <div class="section-header">
        <h2 class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Daftar Catatan
        </h2>
        <span class="badge" id="notes-count">0 catatan</span>
      </div>

      <div id="notes-list">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Memuat catatan...</p>
        </div>
        <div class="empty-state" id="empty-state" style="display:none;">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M18 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="m22 22-1.5-1.5"/></svg>
          <p>Belum ada catatan</p>
          <span>Mulai tambah catatan pertamamu!</span>
        </div>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Tugas 2 &mdash; Yusuf Nur Ramadhan_123230188</p>
  </footer>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p class="modal-message" id="modal-message">Yakin ingin menghapus catatan ini?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Batal</button>
        <button class="btn btn-danger" id="modal-confirm">Hapus</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="index.js"></script>
</body>
</html>
