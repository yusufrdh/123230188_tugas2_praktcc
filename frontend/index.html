<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catatan - Aplikasi Notes Modern dengan Express.js dan MySQL">
  <title>Catatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        <span>Catatan</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Beranda
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-new-note" id="btn-scroll-form">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Buat Catatan
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Form Card -->
      <section class="card form-card" id="form-section">
        <h2 class="card-title" id="form-title">Tambah Catatan Baru</h2>
        <form id="note-form" autocomplete="off">
          <div class="form-group">
            <label for="judul">Judul</label>
            <input type="text" id="judul" placeholder="Masukkan judul catatan..." required>
          </div>
          <div class="form-group">
            <label for="isi">Isi Catatan</label>
            <textarea id="isi" rows="4" placeholder="Tuliskan pikiranmu di sini..." required></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="btn-cancel" style="display:none;">Batal</button>
            <button type="submit" class="btn btn-primary" id="btn-submit">Simpan</button>
          </div>
        </form>
      </section>

      <!-- Notes List -->
      <section class="notes-section">
        <div class="section-header">
          <h2 class="section-title">Catatan Terbaru</h2>
          <span class="badge" id="notes-count">0 catatan</span>
        </div>

        <div id="notes-list" class="notes-grid">
          <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat catatan...</p>
          </div>
          <div class="empty-state" id="empty-state" style="display:none;">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>Belum ada catatan</p>
            <span>Klik "Buat Catatan" untuk memulai!</span>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p>Tugas 2 &mdash; Yusuf Nur Ramadhan_123230188</p>
      </footer>
    </main>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
      <p class="modal-message" id="modal-message">Yakin ingin menghapus catatan ini?</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">Batal</button>
        <button class="btn btn-danger" id="modal-confirm">Hapus</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="index.js"></script>
</body>
</html>
